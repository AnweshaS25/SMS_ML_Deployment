services:
  - type: web
    name: sms-ml-prediction-api
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt && python download_nltk.py

    # Download NLTK stopwords before starting FastAPI
    startCommand: python download_nltk.py && uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7

        # Tell NLTK where to find the downloaded stopwords
      - key: NLTK_DATA
        value: /opt/render/project/src/nltk_data